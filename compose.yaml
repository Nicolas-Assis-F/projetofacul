services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: baiao
      POSTGRES_PASSWORD: ${DB_PASS:?Defina DB_PASS no arquivo .env}
      POSTGRES_DB: baiao_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baiao -d baiao_db"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    environment:
      DB_HOST: db
      DB_USER: baiao
      DB_PASS: ${DB_PASS:?Defina DB_PASS no arquivo .env}
      DB_NAME: baiao_db
      CORS_ORIGIN: ${CORS_ORIGIN:-}
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres-data:
