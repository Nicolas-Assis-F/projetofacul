services:
  - type: web
    name: baiao-api
    runtime: node
    plan: free
    branch: Nicolas-Assis-F/terminar
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:deploy
    healthCheckPath: /ready
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: baiao-db
          property: connectionString
databases:
  - name: baiao-db
    plan: free
    postgresMajorVersion: '16'
    databaseName: baiao_db
    user: baiao
    ipAllowList: []
